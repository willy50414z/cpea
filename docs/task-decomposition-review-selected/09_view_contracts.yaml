---
# 原檔：v_customer_value.yaml
version: 3
view: demo_retail.v_customer_value
summary: 粒度：每會員一列，包含未下單會員；
grain:
  description: 每會員一列，包含未下單會員
  keys:
  - customer_id
columns:
  customer_id:
    type: number
    role: identifier
    description: 會員id
  customer_name:
    type: string
    role: dimension
    description: 會員名稱
  membership_tier:
    type: string
    role: dimension
    description: 會員等級；一般、銀卡、金卡、VIP
  city:
    type: string
    role: dimension
    description: 會員登記城市，不是交易門市所在地
  registered_on:
    type: date
    role: dimension
    description: 會員註冊日期。
  completed_order_count:
    type: number
    role: measure
    description: 會員已完成訂單筆數；未下單為 0
  lifetime_spend:
    type: number
    role: measure
    description: 會員在累計折扣後消費金額，單位 TWD
    unit: TWD
  avg_order_value:
    type: number
    role: measure
    description: 會員平均已完成訂單消費額，單位 TWD/筆
    unit: TWD/筆
    disallowed_aggregations:
    - sum
    - avg
  last_order_date:
    type: date
    role: dimension
    description: 會員最後一筆已完成訂單的日期；沒有已完成訂單時為 NULL
  active_in_last_90d:
    type: boolean
    role: dimension
    description: 最近 90 日內有已完成訂單；沒有則為 false。
---
# 原檔：v_daily_sales.yaml
version: 3
view: demo_retail.v_daily_sales
summary: 粒度：門市×有銷售的日期；沒有交易的門市日期不出現。適合每日營收、門市趨勢
grain:
  description: 門市×有銷售的日期
  keys:
  - sales_date
  - store_id
columns:
  sales_date:
    type: date
    role: dimension
    description: 已完成訂單的銷售日期；無交易的門市日期不會有資料列。
  store_id:
    type: number
    role: identifier
    description: 門市id
  store_name:
    type: string
    role: dimension
    description: 門市名稱
  region:
    type: string
    role: dimension
    description: 門市所屬區域；北部、中部、南部
  city:
    type: string
    role: dimension
    description: 門市所在城市
  order_count:
    type: number
    role: measure
    description: 門市已完成訂單筆數
  units_sold:
    type: number
    role: measure
    description: 門市已完成訂單銷售的商品總件數；單位件
    unit: 件
  revenue:
    type: number
    role: measure
    description: 門市折扣後的銷售淨額總和，單位 TWD
    unit: TWD
  gross_profit:
    type: number
    role: measure
    description: 門市此日毛利總額（折扣後淨額 − 商品成本），單位 TWD
    unit: TWD
---
# 原檔：v_inventory_status.yaml
version: 3
view: demo_retail.v_inventory_status
summary: '粒度：門市×商品；stock_status: 缺貨/需補貨/正常。estimated_days_of_supply 根據最近30日銷量估算，無銷量時為 NULL。'
grain:
  description: 門市×商品
  keys:
  - store_id
  - product_id
columns:
  snapshot_date:
    type: date
    role: dimension
    description: 庫存盤點日期
  store_id:
    type: number
    role: identifier
    description: 庫存所屬門市識別碼；與 product_id 組合唯一決定一列。
  store_name:
    type: string
    role: dimension
    description: 庫存所屬門市名稱。
  region:
    type: string
    role: dimension
    description: 庫存門市所屬區域；北部、中部、南部。
  city:
    type: string
    role: dimension
    description: 庫存門市所在城市。
  product_id:
    type: number
    role: identifier
    description: 庫存商品識別碼；與 store_id 組合唯一決定一列。
  sku:
    type: string
    role: identifier
    description: 商品庫存單位代碼（SKU）。
  product_name:
    type: string
    role: dimension
    description: 庫存商品名稱。
  category:
    type: string
    role: dimension
    description: 庫存商品分類。
  stock_qty:
    type: number
    role: measure
    description: 快照當日此門市此商品的庫存件數，單位件；同商品跨門市可加總，不可跨不同快照日期直接加總。
    unit: 件
  reorder_point:
    type: number
    role: measure
    description: 此門市此商品的補貨警戒件數；stock_qty 不高於此值即判定需補貨（若為 0 件則為缺貨）。
  stock_status:
    type: string
    role: dimension
    description: 庫存狀態；stock_qty=0 為缺貨，0<stock_qty<=reorder_point 為需補貨，其餘為正常。
  inventory_cost_value:
    type: number
    role: measure
    description: 庫存成本估值，stock_qty × 商品主檔 unit_cost，單位 TWD；不是預估銷售額。
    unit: TWD
  sold_qty_30d:
    type: number
    role: measure
    description: 過去 30 個曆日，此門市此商品已完成訂單銷售件數；無銷量為 0。
  estimated_days_of_supply:
    type: number
    role: measure
    description: 預估庫存可銷售天數，stock_qty × 30 ÷ sold_qty_30d，單位天；近 30 日銷量為 0 時為 NULL，屬簡化估計。
    unit: 天
---
# 原檔：v_order_summary.yaml
version: 3
view: demo_retail.v_order_summary
summary: 粒度：每筆已完成訂單一列；適合訂單數、客單價、單筆訂單金額與通路分析；取消訂單已排除。
grain:
  description: 每筆已完成訂單一列
  keys:
  - order_id
columns:
  order_id:
    type: number
    role: identifier
    description: 已完成訂單的唯一識別碼；本 View 每筆訂單只有一列。
  order_no:
    type: string
    role: identifier
    description: 訂單編號；本 View 每筆已完成訂單只有一列。
  order_date:
    type: date
    role: dimension
    description: 訂單成立日期（曆日），不含時間。
  order_month:
    type: date
    role: dimension
    description: 訂單成立月份的第一天，供月份統計與篩選。
  store_id:
    type: number
    role: identifier
    description: 訂單所屬門市識別碼。
  store_name:
    type: string
    role: dimension
    description: 訂單所屬門市名稱。
  region:
    type: string
    role: dimension
    description: 訂單門市所屬區域；北部、中部、南部。
  store_city:
    type: string
    role: dimension
    description: 訂單門市所在城市，不是會員居住城市。
  sales_channel:
    type: string
    role: dimension
    description: 訂單銷售通路；in_store=實體門市，online=線上。
  customer_id:
    type: number
    role: identifier
    description: 下單會員識別碼。
  customer_name:
    type: string
    role: dimension
    description: 下單會員名稱；為虛構測試資料。
  membership_tier:
    type: string
    role: dimension
    description: 下單會員等級；一般、銀卡、金卡、VIP。
  item_lines:
    type: number
    role: measure
    description: 此訂單的商品明細列數（COUNT order_item_id）；不是總銷售件數。
  total_quantity:
    type: number
    role: measure
    description: 此訂單全部明細的商品銷售件數加總；單位件。
    unit: 件
  order_amount:
    type: number
    role: measure
    description: 此訂單折扣後的總銷售金額（各明細 quantity × unit_price − discount），單位 TWD。
    unit: TWD
  cost_amount:
    type: number
    role: measure
    description: 此訂單全部明細的商品成本總額，單位 TWD。
    unit: TWD
  gross_profit:
    type: number
    role: measure
    description: 此訂單毛利，order_amount − cost_amount，單位 TWD。
    unit: TWD
---
# 原檔：v_product_monthly.yaml
version: 3
view: demo_retail.v_product_monthly
summary: 粒度：門市×月份×商品；適合商品/分類排行、商品銷量及毛利，不含訂單筆數；商品跨店排行需加總 net_sales/units_sold。
grain:
  description: 門市×月份×商品
  keys:
  - store_id
  - sales_month
  - product_id
columns:
  sales_month:
    type: date
    role: dimension
    description: 商品銷售統計月份的第一天；月度粒度。
  store_id:
    type: number
    role: identifier
    description: 交易門市識別碼；與 sales_month、product_id 組合唯一決定一列。
  store_name:
    type: string
    role: dimension
    description: 交易門市名稱。
  region:
    type: string
    role: dimension
    description: 交易門市所屬區域；北部、中部、南部。
  city:
    type: string
    role: dimension
    description: 交易門市所在城市。
  product_id:
    type: number
    role: identifier
    description: 商品識別碼；與 store_id、sales_month 組合唯一決定一列。
  sku:
    type: string
    role: identifier
    description: 商品庫存單位代碼（SKU）。
  product_name:
    type: string
    role: dimension
    description: 商品名稱。
  category:
    type: string
    role: dimension
    description: 商品分類，例如飲料、零食、日用品。
  units_sold:
    type: number
    role: measure
    description: 此門市此月份此商品的銷售件數合計；單位件。
    unit: 件
  gross_sales:
    type: number
    role: measure
    description: 此門市此月份此商品的折扣前銷售額，單位 TWD。
    unit: TWD
  discount_amount:
    type: number
    role: measure
    description: 此門市此月份此商品的折扣金額合計，單位 TWD。
    unit: TWD
  net_sales:
    type: number
    role: measure
    description: 此門市此月份此商品的折扣後銷售額，單位 TWD；適合跨門市彙總商品營收。
    unit: TWD
  gross_profit:
    type: number
    role: measure
    description: 此門市此月份此商品的毛利總額，單位 TWD；不是毛利率。
    unit: TWD
---
# 原檔：v_sales_detail.yaml
version: 3
view: demo_retail.v_sales_detail
summary: 粒度：每筆已完成訂單的每個商品品項；僅含已完成訂單。銷售額為折扣後淨額，毛利=淨額-成本。請勿以 COUNT(*) 當訂單數。
grain:
  description: 每筆已完成訂單的每筆商品明細
  keys:
    - order_id
    - product_id
columns:
  order_id:
    type: number
    role: identifier
    description: 訂單內部識別碼；同一訂單可有多筆商品明細，因此此欄位在本 View 不唯一。
  order_no:
    type: string
    role: identifier
    description: 提供使用者辨識訂單的訂單編號；同一訂單的多筆明細會重複。
  order_date:
    type: date
    role: dimension
    description: 訂單成立的曆日，由 ordered_at 轉為日期；不含時間。
  order_month:
    type: date
    role: dimension
    description: 訂單成立月份的第一天，供月度篩選與彙總；不是付款月份。
  store_id:
    type: number
    role: identifier
    description: 交易所屬門市的識別碼。
  store_name:
    type: string
    role: dimension
    description: 交易所屬門市名稱。
  region:
    type: string
    role: dimension
    description: 門市所屬區域；測試資料為北部、中部、南部。
  store_city:
    type: string
    role: dimension
    description: 交易門市所在城市；不是會員居住城市。
  sales_channel:
    type: string
    role: dimension
    description: 銷售通路；in_store=實體門市，online=線上。
  customer_id:
    type: number
    role: identifier
    description: 下單會員識別碼；同一會員可能有多筆訂單及明細。
  customer_name:
    type: string
    role: dimension
    description: 下單會員名稱；為虛構測試資料。
  membership_tier:
    type: string
    role: dimension
    description: 下單會員所屬等級；一般、銀卡、金卡、VIP。
  product_id:
    type: number
    role: identifier
    description: 商品識別碼；同商品可能出現在不同訂單明細。
  sku:
    type: string
    role: identifier
    description: 商品庫存單位代碼（SKU），用於辨識商品。
  product_name:
    type: string
    role: dimension
    description: 本筆訂單明細販售的商品名稱。
  category:
    type: string
    role: dimension
    description: 商品所屬分類，例如飲料、零食、日用品。
  quantity:
    type: number
    role: measure
    description: 本筆明細銷售件數；僅含已完成訂單，可依商品、門市、期間加總。
  unit_price:
    type: number
    role: measure
    description: 下單時每件商品的銷售單價，單位 TWD/件；不代表商品目前定價，不應直接加總單價。
    unit: TWD/件
    disallowed_aggregations:
    - sum
  gross_sales:
    type: number
    role: measure
    description: 本筆明細折扣前銷售金額，計算為 quantity × unit_price，單位 TWD。
    unit: TWD
  discount_amount:
    type: number
    role: measure
    description: 本筆明細的折扣金額，單位 TWD；為非負數。
    unit: TWD
  net_sales:
    type: number
    role: measure
    description: 本筆明細折扣後銷售金額，gross_sales − discount_amount，單位 TWD；不等於 gross_sales。
    unit: TWD
  cost_amount:
    type: number
    role: measure
    description: 本筆明細商品成本總額，quantity × 下單時 unit_cost，單位 TWD。
    unit: TWD
  gross_profit:
    type: number
    role: measure
    description: 本筆明細毛利，net_sales − cost_amount，單位 TWD；不是毛利率。
    unit: TWD
---
# 原檔：v_store_monthly_kpi.yaml
version: 3
view: demo_retail.v_store_monthly_kpi
summary: 粒度：每門市每月一列。營收、毛利、訂單數、客單價、月目標與達標率；百分比數值為 0~100。
grain:
  description: 每門市每月一列
  keys:
  - store_id
  - sales_month
columns:
  sales_month:
    type: date
    role: dimension
    description: 業績統計月份的第一天；月度粒度，而不是單日交易。
  store_id:
    type: number
    role: identifier
    description: 門市識別碼；與 sales_month 組合唯一決定一列。
  store_name:
    type: string
    role: dimension
    description: 門市名稱。
  region:
    type: string
    role: dimension
    description: 門市所屬區域；北部、中部、南部。
  city:
    type: string
    role: dimension
    description: 門市所在城市。
  order_count:
    type: number
    role: measure
    description: 該門市當月已完成訂單筆數；沒有成交訂單時為 0。
  units_sold:
    type: number
    role: measure
    description: 該門市當月已完成訂單的商品銷售件數總和；單位件。
    unit: 件
  revenue:
    type: number
    role: measure
    description: 該門市當月折扣後銷售淨額，單位 TWD；沒有成交訂單時為 0。
    unit: TWD
  gross_profit:
    type: number
    role: measure
    description: 該門市當月毛利總額（折扣後淨額 − 商品成本），單位 TWD。
    unit: TWD
  gross_margin_pct:
    type: number
    role: measure
    description: 該門市當月毛利率，gross_profit ÷ revenue × 100，單位 %（0～100 表示百分比）；營收為 0 時回傳 0。跨門市或月份需以總毛利／總營收重算，勿直接加總或平均百分比。
    unit: '%'
    disallowed_aggregations:
    - sum
    - avg
  avg_order_value:
    type: number
    role: measure
    description: 該門市當月平均每筆已完成訂單的折扣後金額，revenue ÷ order_count，單位 TWD/筆；沒有訂單時為 0。跨門市或月份應以總營收／總訂單數重算。
    unit: TWD/筆
    disallowed_aggregations:
    - sum
    - avg
  target_amount:
    type: number
    role: measure
    description: 該門市該月份設定的營收目標，單位 TWD。
    unit: TWD
  target_achievement_pct:
    type: number
    role: measure
    description: 該門市當月營收達標率，revenue ÷ target_amount × 100，單位 %；目標為 0 時回傳 NULL。跨門市或月份應以總營收／總目標重算。
    unit: '%'
    disallowed_aggregations:
    - sum
    - avg
  is_complete_month:
    type: boolean
    role: dimension
    description: 是否為此示範資料中的完整統計月份；2026-10 為 false，其他月份為 true；為固定示範邏輯，非即時判斷。
